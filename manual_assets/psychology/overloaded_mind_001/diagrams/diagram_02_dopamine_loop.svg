<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#070b10"/>
  <text x="90" y="105" fill="#f4efe7" font-family="Arial" font-size="46">Дофаминовая петля</text>
  <text x="90" y="153" fill="#9da7a8" font-family="Arial" font-size="24">Когда отдых становится ещё одним видом стимуляции</text>
  <g font-family="Arial" font-size="30" fill="#f4efe7" text-anchor="middle">
    <circle cx="300" cy="315" r="92" fill="#111c24" stroke="#6f8990" stroke-width="3"/>
    <text x="300" y="306">усталость</text>
    <text x="300" y="344" fill="#aebabc" font-size="22">нет сил</text>
    <circle cx="640" cy="245" r="92" fill="#111c24" stroke="#c8a96a" stroke-width="3"/>
    <text x="640" y="236">контент</text>
    <text x="640" y="274" fill="#aebabc" font-size="22">быстрый вход</text>
    <circle cx="980" cy="315" r="92" fill="#111c24" stroke="#6f8990" stroke-width="3"/>
    <text x="980" y="306">облегчение</text>
    <text x="980" y="344" fill="#aebabc" font-size="22">на минуту</text>
    <circle cx="640" cy="520" r="92" fill="#111c24" stroke="#a34f4f" stroke-width="3"/>
    <text x="640" y="511">истощение</text>
    <text x="640" y="549" fill="#aebabc" font-size="22">ещё меньше тишины</text>
  </g>
  <g fill="none" stroke="#d8eef0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#d8eef0"/>
      </marker>
    </defs>
    <path d="M390 292 C470 230 520 226 548 237"/>
    <path d="M732 238 C815 230 876 254 906 286"/>
    <path d="M948 405 C880 500 775 530 733 526"/>
    <path d="M548 525 C442 505 340 430 312 407"/>
  </g>
</svg>
