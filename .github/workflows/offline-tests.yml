name: offline-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AI_YOUTUBE_ALLOW_LIVE_TESTS: "0"
      AI_YOUTUBE_RUN_LIVE_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg (ffmpeg-full 8.1.2, pinned via Chocolatey)
        shell: pwsh
        run: |
          choco install ffmpeg-full --version=8.1.2 --confirm --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) {
            throw "choco install ffmpeg-full --version=8.1.2 failed with exit code $LASTEXITCODE"
          }
      - name: Preflight - verify ffmpeg and ffprobe are on PATH
        shell: pwsh
        run: |
          $ffmpegCmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $ffprobeCmd = Get-Command ffprobe -ErrorAction SilentlyContinue
          if (-not $ffmpegCmd) {
            throw "ffmpeg was not found on PATH after installing ffmpeg-full 8.1.2"
          }
          if (-not $ffprobeCmd) {
            throw "ffprobe was not found on PATH after installing ffmpeg-full 8.1.2"
          }
          Write-Host "ffmpeg resolved to: $($ffmpegCmd.Source)"
          Write-Host "ffprobe resolved to: $($ffprobeCmd.Source)"
          & ffmpeg -version
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg -version failed with exit code $LASTEXITCODE"
          }
          & ffprobe -version
          if ($LASTEXITCODE -ne 0) {
            throw "ffprobe -version failed with exit code $LASTEXITCODE"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Verify editable package installation
        run: python -m pip install --no-deps --no-build-isolation --editable .
      - name: Validate agent docs and skills governance
        run: python -B -m tools.qa.check_agent_docs
      - name: Run offline unit and integration suite
        run: python -B -m unittest discover -s tests -p "test_*.py"
