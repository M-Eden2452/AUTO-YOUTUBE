name: offline-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    # 45, not 20. The ceiling used to sit within a few minutes of the work it
    # bounds: the suite alone measured 15.5 minutes locally on 2026-08-17 and
    # 15.5 again after package D (927 s, 2379 tests), and this job also installs
    # ffmpeg-full through Chocolatey and two lockfiles before it starts. On a
    # runner slower than the local machine that is not headroom, it is a coin
    # flip - and a suite that times out reads exactly like a suite that failed.
    #
    # Raising the number is the honest fix and not a way to stop watching: the
    # growth itself is recorded and owned - 1441 tests / 231.8 s at the plan's
    # measurement, 2379 / 927 s now - and 45 still stops a hung job long before
    # GitHub's own six-hour limit. What must never be done to fit a ceiling is
    # dropping tests from the blocking run.
    timeout-minutes: 45
    env:
      AI_YOUTUBE_ALLOW_LIVE_TESTS: "0"
      AI_YOUTUBE_RUN_LIVE_TESTS: "0"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the governance checker verifies that every
          # last_verified_commit / baseline_head is a real commit reachable
          # from HEAD. The default depth-1 checkout cannot answer that.
          fetch-depth: 0
      - name: Install FFmpeg (ffmpeg-full 8.1.2, pinned via Chocolatey)
        shell: pwsh
        run: |
          choco install ffmpeg-full --version=8.1.2 --confirm --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) {
            throw "choco install ffmpeg-full --version=8.1.2 failed with exit code $LASTEXITCODE"
          }
      - name: Preflight - verify ffmpeg and ffprobe are on PATH
        shell: pwsh
        run: |
          $ffmpegCmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $ffprobeCmd = Get-Command ffprobe -ErrorAction SilentlyContinue
          if (-not $ffmpegCmd) {
            throw "ffmpeg was not found on PATH after installing ffmpeg-full 8.1.2"
          }
          if (-not $ffprobeCmd) {
            throw "ffprobe was not found on PATH after installing ffmpeg-full 8.1.2"
          }
          Write-Host "ffmpeg resolved to: $($ffmpegCmd.Source)"
          Write-Host "ffprobe resolved to: $($ffprobeCmd.Source)"
          & ffmpeg -version
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg -version failed with exit code $LASTEXITCODE"
          }
          & ffprobe -version
          if ($LASTEXITCODE -ne 0) {
            throw "ffprobe -version failed with exit code $LASTEXITCODE"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Verify editable package installation
        run: python -m pip install --no-deps --no-build-isolation --editable .
      - name: Install dev tooling for machine gates
        run: python -m pip install --requirement requirements-dev.lock
      - name: Validate agent docs and skills governance
        run: python -B -m tools.qa.check_agent_docs
      - name: Run machine quality gates
        run: python scripts/gates.py
      - name: Run offline unit and integration suite
        run: python -B -m unittest discover -s tests -p "test_*.py"
