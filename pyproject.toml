[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-youtube"
version = "0.1.0"
description = "Offline-first tooling and workflows for AI-assisted YouTube production."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "moviepy==2.2.1",
    "numpy==2.4.4",
    "pillow==11.3.0",
    "imageio-ffmpeg==0.6.0",
    "python-dotenv==1.2.2",
    "openai==2.36.0",
    "requests==2.33.1",
    "PyYAML==6.0.3",
    "elevenlabs==2.58.0",
    "questionary==2.1.1",
]

[project.scripts]
ai-youtube = "ai_youtube.cli.main:main"

[project.optional-dependencies]
anime-factory = [
    "faster-whisper>=1.2,<2",
    "soundfile>=0.13,<1",
    "opencv-python>=4.10,<5",
]

[tool.setuptools]
include-package-data = true
py-modules = ["pipeline"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_youtube*", "src*", "anime_factory*", "apps*"]
exclude = ["tests*", "venv*", "projects*", "outputs*", "assets*"]
